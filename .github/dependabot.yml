version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
